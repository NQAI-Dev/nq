name: nq CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            install: |
              # Cache apt packages so subsequent runs reuse /var/cache/apt/archives/
              # keyed on the package list. Saves ~25s per run vs cold install of SDL3.
              - name: Cache apt archives
                uses: actions/cache@v4
                with:
                  path: /var/cache/apt/archives
                  key: ${{ runner.os }}-apt-sdl3-${{ hashFiles('CMakeLists.txt') }}
                  restore-keys: |
                    ${{ runner.os }}-apt-sdl3-

              - name: Install SDL3 + cmake
                run: |
                  sudo apt-get update
                  sudo apt-get install -y libsdl3-dev cmake ninja-build
          - os: macos-latest
            install: |
              brew update
              brew install sdl3 cmake ninja
          - os: windows-latest
            install: |
              choco install -y sdl3 --prerelease cmake ninja

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDL3 + cmake
        shell: bash
        run: ${{ matrix.install }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DNQ_BUILD_TESTS=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Test
        shell: bash
        working-directory: build
        run: ctest --output-on-failure
